services:
  - type: web
    name: registre-equipements-publics
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run seed && npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: NODE_ENV
        value: production
